[package]
name = "flt-cli"
version = "0.1.0"
edition = "2021"
default-run = "flt-cli"

# Upstream's development loop, unchanged.
[[bin]]
name = "flt-cli"
path = "src/main.rs"

# Dartvel's: produces a bundle that can leave the machine. The name matters —
# Dartvel's preflight looks for exactly this executable.
[[bin]]
name = "dartvel-cli-flt"
path = "src/bin/dartvel_cli_flt.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.2.1", features = ["derive"] }
