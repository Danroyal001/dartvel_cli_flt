[package]
name = "flt-term"
version = "0.1.0"
edition = "2021"
description = "Terminal output and input for the Dartvel terminal runner: frame encoders, terminal detection, input parsing, frame pacing. No Flutter dependency, so every piece is testable without an engine."

[dependencies]
base64 = "0.22.1"
miniz_oxide = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2.178"
